name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unpack app zip
        run: |
          unzip -qo Rungfinal.zip -d app
          ls app | head

      - name: Install + Capacitor
        working-directory: app
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          printf '%s\n' '{"appId":"com.jairqzri.rung","appName":"Rung","webDir":"dist"}' > capacitor.config.json

      - name: Build web
        working-directory: app
        run: |
          npm run build --if-present || true
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rung</title></head><body style="font-family:system-ui;background:#111;color:#eee;padding:24px"><h1>Rung</h1><p>Wrapper installed. Full Vite build did not emit dist/index.html on this run.</p></body></html>' > dist/index.html
          fi

      - name: Android project
        working-directory: app
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Assemble debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rung-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
