<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Rung</title>
<style>
  :root { --bg:#0e0f12; --card:#17181d; --line:#2a2c33; --txt:#eee; --mut:#8b8e97; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px 16px 8px; }
  h1 { margin:0; font-size:28px; }
  .row { display:flex; gap:8px; padding:8px 16px 16px; }
  input, button, select { font:inherit; }
  input { flex:1; background:#111; color:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  button { background:#fff; color:#111; border:0; border-radius:10px; padding:10px 14px; font-weight:600; }
  .tier { margin:10px 12px; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .tier-h { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; font-weight:700; }
  .items { min-height:48px; background:var(--card); padding:8px; display:flex; flex-wrap:wrap; gap:8px; }
  .item { background:#222; border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; gap:8px; align-items:center; }
  .item button { background:#333; color:#fff; padding:6px 8px; font-size:12px; }
  .unranked .tier-h { background:#2a2c33; }
</style>
</head>
<body>
<header>
  <h1>Rung</h1>
  <p style="color:var(--mut);margin:6px 0 0">Offline tier list. Saved on this phone.</p>
</header>
<div class="row">
  <input id="label" placeholder="Add item"/>
  <button id="add">Add</button>
</div>
<div id="board"></div>
<script>
const TIERS = [
  {id:'s', name:'S', color:'#ff5a5a'},
  {id:'a', name:'A', color:'#ff8a3d'},
  {id:'b', name:'B', color:'#ffd23f'},
  {id:'c', name:'C', color:'#6dd36d'},
  {id:'d', name:'D', color:'#5aa7ff'},
  {id:'u', name:'Unranked', color:'#666'}
];
const KEY = 'rung-v1';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); render(); }
function add(){
  const el = document.getElementById('label');
  const t = el.value.trim(); if(!t) return;
  items.push({id:Date.now()+Math.random(), label:t, tier:'u'});
  el.value=''; save();
}
function move(id, dir){
  const order = TIERS.map(t=>t.id);
  const it = items.find(x=>x.id==id); if(!it) return;
  const i = order.indexOf(it.tier);
  it.tier = order[Math.max(0, Math.min(order.length-1, i+dir))];
  save();
}
function del(id){ items = items.filter(x=>x.id!=id); save(); }
function render(){
  const root = document.getElementById('board');
  root.innerHTML = TIERS.map(t => {
    const list = items.filter(x=>x.tier===t.id);
    return `<section class="tier ${t.id==='u'?'unranked':''}">
      <div class="tier-h" style="background:\( {t.color};color:#111"> \){t.name} · ${list.length}</div>
      <div class="items">${list.map(x=>`
        <div class="item">
          <span>${x.label}</span>
          <button onclick="move(${JSON.stringify(x.id)},-1)">↑</button>
          <button onclick="move(${JSON.stringify(x.id)},1)">↓</button>
          <button onclick="del(${JSON.stringify(x.id)})">×</button>
        </div>`).join('')||'<span style="color:#777;padding:6px">Empty</span>'}
      </div>
    </section>`;
  }).join('');
}
document.getElementById('add').onclick = add;
document.getElementById('label').addEventListener('keydown', e => { if(e.key==='Enter') add(); });
render();
</script>
</body>
</html>
